name: Setup Xcode
description: Select a preinstalled Xcode version on a GitHub-hosted macOS runner

inputs:
  xcode-version:
    description: Xcode version or major version to select
    required: true

runs:
  using: composite
  steps:
    - name: Select preinstalled Xcode
      shell: bash
      env:
        REQUESTED_XCODE_VERSION: ${{ inputs.xcode-version }}
      run: |
        set -euo pipefail

        version_matches() {
          local installed_version="$1"
          local requested_version="$2"

          [[ "$installed_version" == "$requested_version" ||
            "$installed_version" == "$requested_version".* ]]
        }

        developer_dir="${DEVELOPER_DIR:-$(xcode-select --print-path)}"
        current_version="$(
          DEVELOPER_DIR="$developer_dir" xcodebuild -version 2>/dev/null |
            awk 'NR == 1 { print $2 }' || true
        )"

        if ! version_matches "$current_version" "$REQUESTED_XCODE_VERSION"; then
          developer_dir=""
          shopt -s nullglob
          xcode_apps=(/Applications/Xcode*.app)

          for xcode_app in "${xcode_apps[@]}"; do
            candidate_dir="$xcode_app/Contents/Developer"
            candidate_version="$(
              DEVELOPER_DIR="$candidate_dir" xcodebuild -version 2>/dev/null |
                awk 'NR == 1 { print $2 }' || true
            )"

            if version_matches "$candidate_version" "$REQUESTED_XCODE_VERSION"; then
              developer_dir="$candidate_dir"
            fi
          done

          if [[ -z "$developer_dir" ]]; then
            echo "::error::Xcode $REQUESTED_XCODE_VERSION is not installed on this runner."
            echo "Available Xcode installations:"
            printf '  %s\n' "${xcode_apps[@]}"
            exit 1
          fi
        fi

        echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
        DEVELOPER_DIR="$developer_dir" xcodebuild -version
