name: CI
on:
  pull_request:
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: pnpm lint

      - name: Typecheck files
        run: pnpm typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run unit tests
        run: pnpm test -- --coverage

  build-library:
    name: Build and validate package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: pnpm build

      - name: Validate package contents
        run: pnpm package:validate

  build-android:
    name: Build Android example
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TURBO_CACHE_DIR: .turbo/android

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache turborepo for Android
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-android-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-android-

      - name: Check turborepo cache for Android
        run: |
          TURBO_CACHE_STATUS=$(pnpm turbo run build:android --filter=tiktok-business-react-native-sdk-example --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json | node -e "let data = ''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => console.log(JSON.parse(data).tasks.find(t => t.taskId === 'tiktok-business-react-native-sdk-example#build:android').cache.status));")

          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> $GITHUB_ENV
          fi

      - name: Install JDK
        if: env.turbo_cache_hit != 1
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Finalize Android SDK
        if: env.turbo_cache_hit != 1
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"


      - name: Cache Gradle
        if: env.turbo_cache_hit != 1
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/files-2.1
            ~/.gradle/caches/transforms-*
          key: ${{ runner.os }}-gradle-${{ hashFiles('example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build example for Android
        if: env.turbo_cache_hit != 1
        env:
          JAVA_OPTS: "-XX:MaxHeapSize=6g"
          GRADLE_OPTS: "-Dorg.gradle.cache.lock.timeout=120000"
        run: |
          pnpm turbo run build:android --filter=tiktok-business-react-native-sdk-example --cache-dir="${{ env.TURBO_CACHE_DIR }}"

  build-ios:
    name: Build iOS example
    runs-on: macos-latest
    timeout-minutes: 45

    env:
      XCODE_VERSION: 26
      TURBO_CACHE_DIR: .turbo/ios

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache turborepo for iOS
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-ios-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-ios-

      - name: Check turborepo cache for iOS
        run: |
          TURBO_CACHE_STATUS=$(pnpm turbo run build:ios --filter=tiktok-business-react-native-sdk-example --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json | node -e "let data = ''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => console.log(JSON.parse(data).tasks.find(t => t.taskId === 'tiktok-business-react-native-sdk-example#build:ios').cache.status));")

          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> $GITHUB_ENV
          fi

      - name: Use appropriate Xcode version
        if: env.turbo_cache_hit != 1
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install Bundler
        if: env.turbo_cache_hit != 1
        working-directory: example
        run: |
          BUNDLER_VERSION=$(ruby -e "lock = File.read('Gemfile.lock'); puts lock[/BUNDLED WITH\s+([0-9.]+)/m, 1]")
          gem install bundler --version "$BUNDLER_VERSION" --no-document
          echo "BUNDLER_VERSION=$BUNDLER_VERSION" >> "$GITHUB_ENV"

      - name: Cache Ruby dependencies
        if: env.turbo_cache_hit != 1
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: example/vendor/bundle
          key: ${{ runner.os }}-ruby-${{ hashFiles('example/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-ruby-

      - name: Install CocoaPods dependencies
        if: env.turbo_cache_hit != 1
        working-directory: example
        run: |
          bundle _${BUNDLER_VERSION}_ config set --local path vendor/bundle
          bundle _${BUNDLER_VERSION}_ install --jobs 4 --retry 3
          LOCKED_HERMES_CHECKSUM=$(ruby -ne 'puts $1 if $_ =~ /^  hermes-engine: ([0-9a-f]+)$/' ios/Podfile.lock)
          bundle _${BUNDLER_VERSION}_ exec pod install --project-directory=ios
          LOCKED_HERMES_CHECKSUM="$LOCKED_HERMES_CHECKSUM" ruby -e '
            path = "ios/Podfile.lock"
            lockfile = File.read(path)
            updated = lockfile.sub(/^  hermes-engine: [0-9a-f]+$/, "  hermes-engine: #{ENV.fetch("LOCKED_HERMES_CHECKSUM")}")
            abort "Unable to normalize the Hermes checksum" if updated == lockfile
            File.write(path, updated)
          '
          git diff --exit-code -- ios/Podfile.lock || {
            echo "Podfile.lock changed beyond the expected machine-specific Hermes checksum."
            exit 1
          }

      - name: Build example for iOS
        if: env.turbo_cache_hit != 1
        run: |
          pnpm turbo run build:ios --filter=tiktok-business-react-native-sdk-example --cache-dir="${{ env.TURBO_CACHE_DIR }}"
