name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (main branch only: major/minor/patch or a specific version like 1.2.3)'
        required: true
        default: 'patch'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@11

      - name: Run checks
        run: pnpm check

      - name: Configure git
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Restore version file after setup
        if: github.ref == 'refs/heads/main'
        run: git restore --source=HEAD --staged --worktree src/version.ts

      - name: Publish production release (main)
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          pnpm release --ci ${{ github.event.inputs.version }}
          --hooks.after:bump="pnpm sync:version && git add src/version.ts"

      - name: Publish dev release (non-main)
        if: github.ref != 'refs/heads/main'
        run: |
          SHA=$(git rev-parse --short HEAD)
          BASE_VERSION=$(node -p "require('./package.json').version")
          DEV_VERSION="${BASE_VERSION}-dev.${SHA}"

          echo "Publishing dev version: $DEV_VERSION (tag: dev)"

          npm version "$DEV_VERSION" --no-git-tag-version
          pnpm build
          npm publish --tag dev
