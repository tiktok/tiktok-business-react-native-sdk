name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (main branch only: major/minor/patch or a specific version like 1.2.3)'
        required: true
        default: 'patch'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: macos-latest
    env:
      XCODE_VERSION: 26

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@11

      - name: Use appropriate Xcode version
        if: github.ref == 'refs/heads/main'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install Bundler
        if: github.ref == 'refs/heads/main'
        working-directory: example
        run: |
          BUNDLER_VERSION=$(ruby -e "lock = File.read('Gemfile.lock'); puts lock[/BUNDLED WITH\s+([0-9.]+)/m, 1]")
          gem install bundler --version "$BUNDLER_VERSION" --no-document
          echo "BUNDLER_VERSION=$BUNDLER_VERSION" >> "$GITHUB_ENV"

      - name: Install Ruby dependencies
        if: github.ref == 'refs/heads/main'
        working-directory: example
        run: |
          bundle _${BUNDLER_VERSION}_ config set --local path vendor/bundle
          bundle _${BUNDLER_VERSION}_ install --jobs 4 --retry 3

      - name: Run checks
        run: pnpm check

      - name: Configure git
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Restore version file after setup
        if: github.ref == 'refs/heads/main'
        run: git restore --source=HEAD --staged --worktree src/version.ts example/ios/Podfile.lock

      - name: Publish production release (main)
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm release --ci ${{ github.event.inputs.version }}

      - name: Publish dev release (non-main)
        if: github.ref != 'refs/heads/main'
        run: |
          SHA=$(git rev-parse --short HEAD)
          BASE_VERSION=$(node -p "require('./package.json').version")
          DEV_VERSION="${BASE_VERSION}-dev.${SHA}"

          echo "Publishing dev version: $DEV_VERSION (tag: dev)"

          npm version "$DEV_VERSION" --no-git-tag-version
          pnpm build
          npm publish --tag dev
