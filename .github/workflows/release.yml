name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (main branch only: major/minor/patch or a specific version like 1.2.3)'
        required: true
        default: 'patch'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    env:
      XCODE_VERSION: 26

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@11

      - name: Run checks
        run: pnpm check

      - name: Use appropriate Xcode version
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # master
        with:
          ruby-version: '4.0.6'
          bundler: none

      - name: Install Bundler
        working-directory: example
        run: |
          BUNDLER_VERSION=$(ruby -e "lock = File.read('Gemfile.lock'); puts lock[/BUNDLED WITH\s+([0-9.]+)/m, 1]")
          gem install bundler --version "$BUNDLER_VERSION" --no-document
          echo "BUNDLER_VERSION=$BUNDLER_VERSION" >> "$GITHUB_ENV"
          echo "BUNDLE_FROZEN=true" >> "$GITHUB_ENV"
          echo "BUNDLE_PATH=$RUNNER_TEMP/bundle" >> "$GITHUB_ENV"

      - name: Install Ruby dependencies
        working-directory: example
        run: bundle _${BUNDLER_VERSION}_ install --jobs 4 --retry 3

      - name: Configure git
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Verify clean working tree before release
        run: |
          STATUS=$(git status --short --untracked-files=all)
          if [[ -n "$STATUS" ]]; then
            printf '%s\n' "$STATUS"
            echo "::error::Release setup modified the working tree."
            exit 1
          fi
          echo "Working tree is clean."

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          RELEASE_ARGS=(--ci)

          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            RELEASE_VERSION="$INPUT_VERSION"
          else
            SHA=$(git rev-parse --short HEAD)
            BASE_VERSION=$(node -p "require('./package.json').version")
            DEV_VERSION="${BASE_VERSION}-dev.${SHA}"
            RELEASE_VERSION="$DEV_VERSION"
            RELEASE_ARGS+=(--git=false --github=false --npm.tag=dev)
          fi

          echo "Publishing version: $RELEASE_VERSION"
          pnpm release "$RELEASE_VERSION" "${RELEASE_ARGS[@]}"
